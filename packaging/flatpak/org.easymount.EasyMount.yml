app-id: org.easymount.EasyMount
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: easymount
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /lib/python*/site-packages/easymount/__pycache__
  - "*.pyc"
modules:
  - name: easymount
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=/app .
      - install -Dm644 data/org.easymount.EasyMount.desktop /app/share/applications/org.easymount.EasyMount.desktop
      - install -Dm644 data/org.easymount.EasyMount.metainfo.xml /app/share/metainfo/org.easymount.EasyMount.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/org.easymount.EasyMount.svg /app/share/icons/hicolor/scalable/apps/org.easymount.EasyMount.svg
    sources:
      - type: dir
        path: ../..
