[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easymount"
version = "0.1.1"
description = "A Linux desktop GUI for persistent SMB and NFS mounts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EasyMount contributors" }]

[project.urls]
Homepage = "https://github.com/tobayashi-san/EasyMount"
Issues = "https://github.com/tobayashi-san/EasyMount/issues"

[project.optional-dependencies]
gui = ["PyGObject"]
test = []

[project.scripts]
easymount = "easymount.app:main"
easymount-agent = "easymount.agent:main"
easymount-helper = "easymount.helper:main"

[tool.setuptools]
packages = ["easymount"]
